# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # https://github.com/marketplace/actions/checkout
      - uses: actions/setup-node@v7 # https://github.com/marketplace/actions/setup-node-js-environment
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5 # https://github.com/marketplace/actions/upload-github-pages-artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  # Publishes what `check` built, and only from main.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5 # https://github.com/marketplace/actions/deploy-github-pages-site
